# Project: OpenMidiSesh
# File: fblint.toml
# Purpose: consistent strict source policy; tools/lint.ps1 defines release inputs.
[tool.fblint]
profile = "strict"
indent-width = 4
honor-suppressions = true
fail-on-warning = true
strict-headers = true
strict-tabs = true
# The compiler's Win32 SDK headers contain a guarded include cycle.
ignored-include-files-rgx = "[/\\\\]inc[/\\\\]win[/\\\\]"
# end of fblint.toml
