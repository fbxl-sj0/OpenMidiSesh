# Project: OpenSesh
# File: .github/workflows/windows-release.yml
# Purpose: run the complete locked Windows release gate on a trusted desktop.
# Responsibilities: retain executable, packages and exact validation evidence.
# This file does not execute arbitrary pull-request revisions on that desktop.

name: Windows release verification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, opensesh-release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tracked inputs
        shell: powershell
        run: |
          python tools/check_repository.py --tracked
          if ($LASTEXITCODE -ne 0) { throw 'Repository integrity failed' }
      - name: Run the complete release verifier
        shell: powershell
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('opensesh-release-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          "OSE_RELEASE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & .\verify_windows_release.ps1 -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows release verification failed' }
      - name: Retain release evidence
        if: always() && env.OSE_RELEASE_EVIDENCE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.sha }}
          path: ${{ env.OSE_RELEASE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

# end of .github/workflows/windows-release.yml
