# Project: OpenSesh
# File: .github/workflows/native-linux.yml
# Purpose: build and exercise public changes on an isolated native Linux runner.
# Responsibilities: validate source integrity, all compiler warnings and tests.
# This file does not run pull-request code on a self-hosted machine.

name: Native Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    # The published compiler packages target Ubuntu 26.04's libc. The hosted
    # VM remains disposable; every compiler package is independently hashed.
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 25
    steps:
      - name: Bootstrap checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified compiler packages
        run: bash tools/install_ci_freebasic.sh
      - name: Verify the tracked source boundary
        run: |
          python3 tools/check_repository.py --tracked
          python3 tests/source_archive_safety.py
          bash tests/dependency_snapshot_negative.sh
      - name: Build with all compiler warnings
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          OUTPUT_PATH="$PWD/build/opensesh" bash build_editor.sh 2>&1 | tee build/linux-build.log
      - name: Run deterministic tests
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIRECTORY="$PWD/build/tests" bash tests/run_tests.sh 2>&1 | tee build/linux-tests.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-validation-${{ github.sha }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 14

# end of .github/workflows/native-linux.yml
